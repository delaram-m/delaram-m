name: Generate GitHub Stats Images

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-images:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Generate stats images
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/github-stats \
            "https://github.com/jstrieb/github-stats/releases/download/2.0.1/github-stats_x86_64-linux"
          echo "5e15e02803559cec5b5bdae4f202939846789c4cd3a34cfd24ee9ff13d6902c5  /tmp/github-stats" | sha256sum --check --status
          chmod +x /tmp/github-stats
          export ACCESS_TOKEN="${ACCESS_TOKEN:-$GITHUB_TOKEN}"
          /tmp/github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          SILENT: "true"
          USERNAME: delaram-m

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Update generated GitHub stats images" || exit 0
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
