name: Generate GitHub Stats Images

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-images:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Sync latest branch state
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Check out github-stats source
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          ref: ef574fae2ce8311f3e1ebb43e07c0c0fae0a41b6
          path: github-stats-src

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Generate stats images
        run: |
          set -euo pipefail
          cd github-stats-src
          zig build
          export ACCESS_TOKEN="${ACCESS_TOKEN:-$GITHUB_TOKEN}"
          mkdir -p ../generated
          ./zig-out/bin/github-stats \
            --overview-output-file ../generated/overview.svg \
            --languages-output-file ../generated/languages.svg \
            --json-output-file ../generated/stats.json
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          SILENT: "true"

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "Update generated GitHub stats images" || exit 0
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
