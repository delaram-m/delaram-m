name: Generate GitHub Stats Images

on:
  push:
    branches:
      - main
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download github-stats CLI
        run: |
          curl \
            --location \
            --output /tmp/github-stats \
            'https://github.com/jstrieb/github-stats/releases/latest/download/github-stats_x86_64-linux'
          chmod +x /tmp/github-stats

      - name: Checkout generated branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin generated:generated 2>/dev/null || true
          git checkout generated 2>/dev/null || git checkout --orphan generated
          # Start clean so leftover files from main don't linger on the generated branch
          git rm -rf --ignore-unmatch . > /dev/null
          cp /tmp/github-stats .
          chmod +x ./github-stats

      - name: Generate images
        run: |
          ./github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_PRIVATE: "false"
          SILENT: "true"

      - name: Commit generated images
        run: |
          rm -f github-stats
          git add .
          git commit -m "Update generated stats images" || true
          git push --set-upstream origin generated
